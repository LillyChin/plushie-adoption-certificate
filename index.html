<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製作你的娃娃領養證書</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>歡迎光臨娃娃領養證書工廠</h1><p>一起為你最珍貴的娃娃，製作一張專屬的領養證書</p>
    <div class="form-card"><h2>填寫領養資料</h2>

    <div class="form-group">
    <label for="plushieName">娃娃姓名：</label>
    <input type="text" id="plushieName" placeholder="來福">
    </div>
    <div class="form-group">
    <label for="ownerName">領養人姓名：</label>
    <input type="text" id="ownerName" placeholder="請輸入領養人姓名">
    </div>
    
    <div class="form-group">
    <label for="birthday">娃娃生日：</label>
    <input type="date" id="birthday">
    </div>
    
    <div class="form-group">
    <label for="adoptionDate">領養日期：</label>
    <input type="date" id="adoptionDate">
    </div>
    
    <div class="form-group">
    <label for="personality">娃娃個性：</label>
    <textarea id="personality" maxlength="100" placeholder="例如：活潑、愛撒嬌"></textarea>
    </div>
    
    <div class="form-group">
    <label for="favoriteFood">最喜歡的食物：</label>
    <input type="text" id="favoriteFood" placeholder="例如:草莓蛋糕">
    </div>
    
    <div class="form-group">
    <label for="photo">娃娃照片：</label>
    <input type="file" id="photo" accept="image/png, image/jpeg">
    </div>
    
    <button type="button" id="generateBtn">產生證書</button>
    <p id="result"></p>
    </div>

    <div class="certificate" id="certificate">
        <img id="certPhoto" alt="娃娃照片" hidden>
        <h2>娃娃領養證書</h2>
        <p>娃娃姓名：<span id="certName">尚未填寫</span></p>
        <p>領養人：<span id="certOwner">尚未填寫</span></p>
        <p>娃娃生日：<span id="certBirthday">尚未填寫</span></p>
        <p>領養日期：<span id="certDate">尚未填寫</span></p>
        <p>娃娃個性：<span id="certPersonality">尚未填寫</span></p>
        <p>最喜歡的食物：<span id="certFood">尚未填寫</span></p>
        <p>永遠幸福快樂!</p>
    </div>

    <button type="button" id="downloadBtn">下載證書 PNG</button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"> </script>
    <script src="script.js"></script>
</body>
</html>
